<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/nav.css">
</head>

<body>
  <nav>
    <div class="left-section">
      <a>Home</a>
      <a>About</a>
      <a>Contact</a>
    </div>
    <div class="right-section">
      <button class="login-button">
        Login
      </button>
    </div>
  </nav>

  <main>
    <h1>My To-Do List</h1>
    <div class="main-content">
      <div class="input-container">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" height="20" width="20">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path d="M6 12H18M12 6V18" stroke="#a8a8a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            </path>
          </g>
        </svg>
        <input type="text" placeholder="Add  a new task...">

        <button class="add-task-btn js-add-task-btn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" height="20" width="20">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_iconCarrier">
              <path d="M6 12H18M12 6V18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              </path>
            </g>


          </svg>
        </button>
      </div>
      <div class="all-tasks-container">

      </div>
      <button class="clear-tasks-button">
        Clear completed
      </button>
    </div>

  </main>


  <script src="scripts/addTasks.js"></script>
</body>

</html>
